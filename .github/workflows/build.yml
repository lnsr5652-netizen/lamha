name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip Lamha-Android-Project.zip
      - name: Build
        run: cd Lamha && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Lamha-APK
          path: Lamha/app/build/outputs/apk/debug/app-debug.apk
